<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b2350"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8873f"/></marker>
  </defs>
  <rect width="900" height="560" fill="#f5f7fb"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2350">가족법인 지분 · 임원 구조 예시</text>
  <text x="450" y="64" text-anchor="middle" font-size="14" fill="#5d6879">부모 2명 · 미성년 자녀 2명 가족의 한 가지 설계안</text>
  <!-- family row -->
  <g font-size="15">
    <rect x="40" y="96" width="185" height="112" rx="14" fill="#fff" stroke="#0b2350" stroke-width="2"/>
    <text x="132" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2350">아버지</text>
    <text x="132" y="156" text-anchor="middle" fill="#1b2433">주주 · 대표이사</text>
    <text x="132" y="182" text-anchor="middle" fill="#5d6879" font-size="13">출자 · 경영 총괄</text>

    <rect x="250" y="96" width="185" height="112" rx="14" fill="#fff" stroke="#9aa6b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="342" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2350">어머니</text>
    <text x="342" y="156" text-anchor="middle" fill="#1b2433">이사 또는 감사</text>
    <text x="342" y="182" text-anchor="middle" fill="#5d6879" font-size="13">주식 없음 (발기인 아님)</text>

    <rect x="465" y="96" width="185" height="112" rx="14" fill="#fff" stroke="#0b2350" stroke-width="2"/>
    <text x="557" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2350">자녀 1</text>
    <text x="557" y="156" text-anchor="middle" fill="#1b2433">주주</text>
    <text x="557" y="182" text-anchor="middle" fill="#5d6879" font-size="13">출자금 자금출처 필요</text>

    <rect x="675" y="96" width="185" height="112" rx="14" fill="#fff" stroke="#0b2350" stroke-width="2"/>
    <text x="767" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#0b2350">자녀 2</text>
    <text x="767" y="156" text-anchor="middle" fill="#1b2433">주주</text>
    <text x="767" y="182" text-anchor="middle" fill="#5d6879" font-size="13">출자금 자금출처 필요</text>
  </g>
  <!-- arrows to corp -->
  <g stroke="#0b2350" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M132,208 L132,250 L400,250 L400,300"/>
    <path d="M557,208 L557,250 L470,250 L470,300"/>
    <path d="M767,208 L767,250 L500,250 L500,300"/>
  </g>
  <path d="M342,208 L342,232 L430,232 L430,300" stroke="#9aa6b8" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a)"/>
  <text x="602" y="242" font-size="13" fill="#0b2350">출자(주식 인수)</text>
  <!-- corp -->
  <rect x="300" y="302" width="300" height="96" rx="16" fill="#0b2350"/>
  <text x="450" y="342" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">가족법인 (주식회사)</text>
  <text x="450" y="372" text-anchor="middle" font-size="14" fill="#c8a96a">법인세 10~25% · 법인 자금은 가족 자금과 분리</text>
  <!-- outflows -->
  <g stroke="#a8873f" stroke-width="2" fill="none" marker-end="url(#g)">
    <path d="M330,398 L200,462"/>
    <path d="M450,398 L450,462"/>
    <path d="M570,398 L700,462"/>
  </g>
  <g font-size="14">
    <rect x="40" y="464" width="260" height="70" rx="12" fill="#fffaf0" stroke="#c8a96a"/>
    <text x="170" y="492" text-anchor="middle" font-weight="700" fill="#5a4310">급여 · 상여 · 퇴직금</text>
    <text x="170" y="516" text-anchor="middle" fill="#5d6879" font-size="13">실제 근무 · 적정 보수만 비용 인정</text>
    <rect x="320" y="464" width="260" height="70" rx="12" fill="#fffaf0" stroke="#c8a96a"/>
    <text x="450" y="492" text-anchor="middle" font-weight="700" fill="#5a4310">배당</text>
    <text x="450" y="516" text-anchor="middle" fill="#5d6879" font-size="13">주주에게 지분 비율대로 · 배당소득세</text>
    <rect x="600" y="464" width="260" height="70" rx="12" fill="#fffaf0" stroke="#c8a96a"/>
    <text x="730" y="492" text-anchor="middle" font-weight="700" fill="#5a4310">기업가치 상승</text>
    <text x="730" y="516" text-anchor="middle" fill="#5d6879" font-size="13">자녀 지분 가치로 귀속(승계 효과)</text>
  </g>
</svg>
