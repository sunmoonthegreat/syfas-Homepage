    <text x="62" y="372" font-size="14" fill="#dbe4f2">법인계좌 개설 · 자본금 이체</text>
    <text x="62" y="398" font-size="14" fill="#dbe4f2">장부 · 증빙으로 실제 사업 운영</text>
